version: "3.9"

services:
  web:
    build: .
    container_name: automated-sports-highlight
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      SECRET_KEY: change-me
      DATABASE_URL: sqlite:///data/sports_highlights.db
      UPLOAD_FOLDER: /app/uploads
      OUTPUT_FOLDER: /app/outputs
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped

